name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes do backend (API mock e servidor MCP)
        run: npm test -w backend

      - name: Testes do frontend (fluxos do aluno e painéis)
        run: npm test -w frontend

      - name: Build de produção (PWA)
        run: npm run build

openapi: 3.0.3
info:
  title: Memora API (mock)
  version: "1.0.0"
  description: |
    API mock do Memora — Express 5, estado em memória (reinicia com o processo, sem banco de
    dados). Reproduz as regras de negócio do Escopo Consolidado v2 para servir de backend ao
    protótipo navegável; não é a API de produção.

    Todas as rotas de negócio vivem sob `/v1`. A autenticação é por sessão simples (token opaco
    em `Authorization: Bearer <token>`), sem JWT nem refresh — ver
    [ADR-0008](./adr/0008-autenticacao-por-sessao-simples.md).

    Cada área do produto (aluno, responsável, B2B, back-office, parceiro) faz login com sua
    própria rota `POST .../auth/login` e recebe um token cujo `role` restringe o que pode
    acessar (`requireRole` em `backend/src/lib/auth.js`).
  contact:
    name: Memora — engenharia
  license:
    name: Uso interno
servers:
  - url: http://localhost:3180/v1
    description: Desenvolvimento local (porta configurável via `PORT`)

tags:
  - name: Sistema
    description: Health check e utilidades do protótipo (`/_proto`).
  - name: Autenticação
    description: Cadastro, login, confirmação e verificação de idade do app do aluno.
  - name: Perfil
    description: Dados da própria conta, sessões, consentimentos e solicitações ao responsável.
  - name: Estudo
    description: Sessão diária, revisões (FSRS), pausas, metas e objetivos.
  - name: Decks
    description: Decks e cards próprios, pastas, publicação e exportação.
  - name: Geração
    description: Pipeline de criação de decks por IA a partir de documento, foto, texto ou Anki.
  - name: Comunidade
    description: Feed, busca, votos, reações, comentários, denúncias e ranking de decks públicos.
  - name: Conteúdos
    description: >
      Resumos, mapas mentais e posts de blog (materiais) — leitura e interação na comunidade,
      e o blog do próprio aluno (criar, editar, publicar para a comunidade ou só para seguidores).
  - name: MCP
    description: >
      Conexões de IAs externas via Model Context Protocol, caixa de "Recebidos" (tudo o que chega
      de outra IA espera a aprovação do aluno) e o próprio endpoint JSON-RPC `POST /mcp` — ver
      [ADR-0011](./adr/0011-servidor-mcp-e-conteudos-gerados-por-ia.md).
  - name: Carteira
    description: Saldo de Neurônios, loja de cupons e resgates.
  - name: Assinatura
    description: Plano Premium, cobrança, cancelamento e reembolso.
  - name: Privacidade
    description: Exportação e exclusão de dados (LGPD), decisões automatizadas.
  - name: Suporte
    description: Chamados do aluno.
  - name: Nôa
    description: Catálogo de ações do agente de IA, sugestões e decisões reversíveis.
  - name: Público
    description: Prévia pública de decks, sem login.
  - name: Painel Parental
    description: Visão e permissões do responsável sobre a conta de um menor.
  - name: Painel B2B
    description: Visão institucional (escola) por turma, com agregação mínima.
  - name: Back-office
    description: Moderação, suporte, comercial, financeiro, compliance e engenharia.
  - name: Painel do Parceiro
    description: Campanhas de cupom, validação de resgate e conversão.

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Token de sessão retornado por qualquer rota `auth/login`. Sessões expiram em 30 dias
        sem uso (deslizante); usar em `me`, `parental`, `b2b`, `admin` e `partner` é mutuamente
        exclusivo por `role`.
    McpToken:
      type: http
      scheme: bearer
      bearerFormat: "mcp_<base64url>"
      description: >
        Token de conexão MCP (`mcp_...`) gerado em `POST /mcp/connections` e exibido uma única
        vez. Só vale para `POST /mcp`; não serve como token de sessão. Revogável em
        `DELETE /mcp/connections/{id}`. O servidor guarda apenas o hash SHA-256.

  parameters:
    deckId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: ID do deck.
    cardId:
      name: cardId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, message: "Sessão inválida ou expirada." }
    Forbidden:
      description: Sessão válida, mas sem permissão para este papel/área.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso não encontrado (ou não pertence ao usuário autenticado).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Corpo da requisição inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "Slug estável da causa, ex.: validation, not_found, guardian_required." }
        message: { type: string, description: "Mensagem em PT-BR, pronta para exibição." }
      additionalProperties: true
      description: Formato uniforme de erro em toda a API (ver `fail()` em `backend/src/lib/helpers.js`).

    User:
      type: object
      description: Perfil público do aluno logado (`publicUser()` em `backend/src/lib/helpers.js`).
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        birthDate: { type: string, format: date }
        isMinor: { type: boolean }
        guardianId: { type: string, nullable: true }
        plan: { type: string, enum: [free, premium] }
        locale: { type: string, example: pt-BR }
        timezone: { type: string, example: America/Sao_Paulo }
        verified:
          type: object
          properties: { email: { type: boolean }, phone: { type: boolean } }
        canEarn: { type: boolean, description: "true somente com e-mail e telefone confirmados." }
        ageVerification:
          type: object
          properties:
            status: { type: string, enum: [pendente, aguardando_responsavel, aprovado] }
            method: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        deactivatedAt: { type: string, format: date-time, nullable: true }
        publicProfile: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        guardianPermissions: { type: object, nullable: true, additionalProperties: true }
        streak: { type: integer }
        studyDays: { type: integer }
        balance: { type: integer, description: "Saldo de Neurônios." }
        onboardingDone: { type: boolean }

    Session:
      type: object
      properties:
        id: { type: string }
        device: { type: string }
        location: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }

    Card:
      type: object
      properties:
        id: { type: string }
        deckId: { type: string }
        type: { type: string, enum: [text, image, audio] }
        front: { type: string }
        back: { type: string }
        media: { type: object, nullable: true, additionalProperties: true }
        lang: { type: string }
        origin:
          type: object
          properties:
            document: { type: string }
            page: { type: integer, nullable: true }
            excerpt: { type: string, nullable: true }
            model: { type: string, nullable: true }
            promptVersion: { type: string, nullable: true }
        uncertain: { type: boolean }
        sched:
          type: object
          description: Estado do agendador FSRS (`backend/src/lib/fsrs.js`).
          properties:
            state: { type: string, enum: [new, review, relearning] }
            stability: { type: number }
            difficulty: { type: number }
            due: { type: string, format: date-time, nullable: true }
            lastReview: { type: string, format: date-time, nullable: true }
            reps: { type: integer }
            lapses: { type: integer }
            consecutiveLapses: { type: integer }

    Deck:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        tags: { type: array, items: { type: string } }
        difficulty: { type: string, enum: [facil, medio, dificil] }
        lang: { type: string }
        difficult: { type: boolean }
        focus: { type: boolean }
        complementary: { type: boolean }
        pinned: { type: boolean }
        scheduled: { type: boolean, description: "false = fora do agendamento (não entra na sessão do dia). Decks recebidos via MCP podem chegar fora." }
        folderId: { type: string, nullable: true }
        source: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        lastStudiedAt: { type: string, format: date-time, nullable: true }
        publication: { type: object, additionalProperties: true }
        cardCount: { type: integer }
        progress:
          type: object
          properties:
            total: { type: integer }
            due: { type: integer }
            mastered: { type: integer }
            learning: { type: integer }
            offlineAvailable: { type: boolean }
            offlineReason: { type: string, nullable: true }

    Folder:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        depth: { type: integer }
        shared: { type: boolean }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              contact: { type: string }
              role: { type: string }
              since: { type: string, format: date-time }
        deckIds: { type: array, items: { type: string } }

    Objective:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        subjects: { type: array, items: { type: string } }
        outcome: { type: string, nullable: true, enum: [aprovado, reprovado, aguardando, nao_fiz, null] }
        outcomeRewarded: { type: boolean }
        daysLeft: { type: integer }
        past: { type: boolean }
        createdAt: { type: string, format: date-time }

    LedgerEntry:
      type: object
      description: Lançamento imutável do ledger de Neurônios (`backend/src/lib/ledger.js`).
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        userId: { type: string }
        amount: { type: integer, description: "Positivo = crédito, negativo = débito." }
        type:
          type: string
          enum: [daily_access, goal_bonus, objective_outcome, clone_bonus, referral_bonus, coupon_redeem, coupon_expired_refund, proto_adjustment]
        meta: { type: object, additionalProperties: true }
        balanceAfter: { type: integer }

    GenerationJob:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        plan: { type: string, enum: [free, premium] }
        source: { type: string, enum: [camera, file, text, anki, empty] }
        documentName: { type: string }
        pages: { type: integer }
        status:
          type: string
          enum: [criado, na_fila, lendo, gerando, pronto, aprovado, falhou, cancelado, acima_do_orcamento, tentando_novamente]
        queuePosition: { type: integer, nullable: true }
        attempt: { type: integer }
        result:
          type: object
          nullable: true
          properties:
            suggested:
              type: object
              properties:
                name: { type: string }
                categoryId: { type: string }
                tags: { type: array, items: { type: string } }
                difficulty: { type: string }
            cards:
              type: array
              items:
                type: object
                properties:
                  tempId: { type: string }
                  front: { type: string }
                  back: { type: string }
                  uncertain: { type: boolean }
                  origin: { type: object, additionalProperties: true }
        approvedDeckId: { type: string, nullable: true }
        overBudget: { type: object, nullable: true, additionalProperties: true }

    Coupon:
      type: object
      properties:
        id: { type: string }
        partnerId: { type: string }
        partnerName: { type: string }
        title: { type: string }
        description: { type: string }
        costNeurons: { type: integer }
        stock: { type: integer }
        validityDays: { type: integer }
        positioning: { type: string, nullable: true, enum: [primeira_posicao, destaque, null] }
        affordable: { type: boolean }
        soldOut: { type: boolean }
        lastUnits: { type: boolean }

    MyCoupon:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        couponId: { type: string }
        partnerName: { type: string }
        title: { type: string }
        code: { type: string, example: "MEM-AB3C-9XZ2" }
        redeemedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        status: { type: string, enum: [emitido, utilizado, expirado, expirado_reembolsado] }
        usedAt: { type: string, format: date-time, nullable: true }

    CommunityDeck:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        difficulty: { type: string }
        lang: { type: string }
        version: { type: integer }
        publishedAt: { type: string, format: date-time }
        tags: { type: array, items: { type: string } }
        stats:
          type: object
          properties:
            studiedWeek: { type: integer }
            votes: { type: integer }
            favorites: { type: integer }
            comments: { type: integer }
            clones: { type: integer }
        reactions: { type: object, additionalProperties: { type: integer } }
        author: { $ref: '#/components/schemas/Author' }
        cardCount: { type: integer }
        commentCount: { type: integer }
        viewer:
          type: object
          properties:
            favorited: { type: boolean }
            voted: { type: boolean }
            canVote: { type: boolean }
            answered: { type: integer }
            total: { type: integer }
            myReactions: { type: array, items: { type: string } }
            cloned: { type: boolean }

    Author:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string }
        topic: { type: string }
        level: { type: integer }
        points: { type: integer }
        badges: { type: array, items: { type: string } }
        neuronsTotal: { type: integer }
        decksCount: { type: integer }
        followers: { type: integer }
        following: { type: boolean }

    Comment:
      type: object
      properties:
        id: { type: string }
        deckId: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    Publication:
      type: object
      description: Submissão de um deck para publicação na comunidade (fila de moderação).
      properties:
        id: { type: string }
        deckId: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        deckName: { type: string }
        version: { type: integer }
        status: { type: string, enum: [em_triagem, em_revisao, aprovado, rejeitado] }
        plan: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        slaHours: { type: integer }
        risk:
          type: object
          properties:
            score: { type: integer }
            level: { type: string, enum: [baixo, medio, alto] }
            factors: { type: array, items: { type: string } }
        reviewType: { type: string, enum: [integral, amostral] }
        decision:
          type: object
          nullable: true
          properties:
            by: { type: string }
            byName: { type: string }
            decision: { type: string, enum: [aprovado, rejeitado] }
            reasonCategory: { type: string, nullable: true }
            excerpt: { type: string, nullable: true }
            appealDeadline: { type: string, format: date-time, nullable: true }
        sla:
          type: object
          properties:
            pct: { type: integer }
            dueAt: { type: string, format: date-time, nullable: true }
            alert: { type: boolean }
            hoursLeft: { type: integer }

    Appeal:
      type: object
      properties:
        id: { type: string }
        publicationId: { type: string }
        authorName: { type: string }
        filedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        text: { type: string }
        status: { type: string, enum: [em_analise, aceita, mantida] }
        reviewer: { type: string, nullable: true }
        originalReviewer: { type: string, nullable: true }

    Report:
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [deck, material, comment, contato_suspeito] }
        targetId: { type: string }
        targetName: { type: string }
        reason: { type: string }
        detail: { type: string, nullable: true }
        reporter: { type: string }
        status: { type: string, enum: [aberta, auto_analise, resolvida] }
        createdAt: { type: string, format: date-time }
        resolution: { type: object, nullable: true, additionalProperties: true }

    SupportTicket:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        subject: { type: string }
        message: { type: string }
        channel: { type: string, enum: [chat, formulario] }
        status: { type: string, enum: [aberto, respondido, resolvido] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        replies:
          type: array
          items:
            type: object
            properties:
              by: { type: string }
              text: { type: string }
              at: { type: string, format: date-time }

    NoaSuggestion:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        actionKey: { type: string, enum: [mark_difficult, adjust_goal, suggest_reinforcement, reorder_queue, reminder_time] }
        title: { type: string }
        status: { type: string, enum: [pendente, aceita, dispensada] }
        deckId: { type: string, nullable: true }
        goal: { type: integer, nullable: true }

    NoaDecision:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        actionKey: { type: string }
        at: { type: string, format: date-time }
        text: { type: string }
        reversible: { type: boolean }
        reverted: { type: boolean }
        contested: { type: object, nullable: true, additionalProperties: true }

    StudySession:
      type: object
      description: Sessão de estudo do dia — retorno de `todaySession()` em `backend/src/routes/study.js`.
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [pronto, sem_cards, concluido, reagendado, pausado] }
        goal: { type: integer }
        goalSuggested: { type: integer }
        doneToday: { type: integer }
        goalHitToday: { type: boolean }
        cardsDue: { type: integer }
        estimatedMinutes: { type: integer }
        plan:
          type: array
          items:
            type: object
            properties:
              deckId: { type: string }
              deckName: { type: string }
              available: { type: integer }
              count: { type: integer }
        scheduledDecks:
          type: array
          description: Decks no agendamento (`scheduled !== false`), com progresso e próxima revisão.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              categoryName: { type: string }
              difficulty: { type: string }
              difficult: { type: boolean }
              focus: { type: boolean }
              total: { type: integer }
              mastered: { type: integer }
              dueNow: { type: integer }
              today: { type: integer, description: "Cards deste deck no plano de hoje." }
              nextDue: { type: string, format: date-time, nullable: true }
              lastStudiedAt: { type: string, format: date-time, nullable: true }
        unscheduledCount: { type: integer, description: "Quantos decks próprios estão fora do agendamento." }
        cards: { type: array, items: { $ref: '#/components/schemas/Card' } }
        streak: { type: integer }
        reschedules: { type: object, properties: { used: { type: integer }, limit: { type: integer } } }
        pausedUntil: { type: string, format: date-time, nullable: true }
        nearestObjective: { type: object, nullable: true, additionalProperties: true }
        noaSuggestion: { $ref: '#/components/schemas/NoaSuggestion' }
        fatigue: { type: object, additionalProperties: true }
        offline: { type: object, additionalProperties: true }
        balance: { type: integer }
        timezone: { type: string }

    Material:
      type: object
      description: >
        Resumo, mapa mental ou post de blog — retorno de `materialPublic()` em
        `backend/src/lib/materials.js`. `body` só vem no detalhe (`full`).
      properties:
        id: { type: string }
        kind: { type: string, enum: [resumo, mapa, noticia], description: "`noticia` = post de blog." }
        kindLabel: { type: string, example: Post de blog }
        ownerId: { type: string }
        authorId: { type: string }
        title: { type: string, maxLength: 140 }
        description: { type: string, maxLength: 400 }
        categoryId: { type: string }
        categoryName: { type: string }
        tags: { type: array, maxItems: 8, items: { type: string } }
        lang: { type: string, enum: [pt-BR, en] }
        aiGenerated: { type: boolean }
        audience: { type: string, enum: [comunidade, seguidores] }
        status: { type: string, enum: [privado, em_triagem, aprovado, rejeitado] }
        source:
          type: object
          properties:
            channel: { type: string, enum: [app, mcp] }
            client: { type: string, nullable: true, description: "Nome da conexão MCP de origem." }
            clientId: { type: string, nullable: true }
            connectionId: { type: string }
        mcpReview: { type: string, enum: [pendente, aprovado, recusado], description: "Só em conteúdos recebidos via MCP." }
        publicationId: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stats: { type: object, properties: { views: { type: integer }, favorites: { type: integer } } }
        reactions: { type: object, additionalProperties: { type: integer } }
        author:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            handle: { type: string, nullable: true }
            badges: { type: array, items: { type: string } }
        readingMinutes: { type: integer }
        excerpt: { type: string }
        preview:
          type: object
          description: "Mapa: `{ root, branches, nodes }` · blog: `{ outlet, url }` · resumo: `{ sections }`."
          additionalProperties: true
        isMine: { type: boolean }
        commentCount: { type: integer }
        viewer:
          type: object
          properties:
            favorited: { type: boolean }
            myReactions: { type: array, items: { type: string } }
        body: { $ref: '#/components/schemas/MaterialBody' }

    MaterialBody:
      type: object
      description: "Resumo/blog: `markdown` (+ `url`/`outlet` no blog) e `sources`; mapa: `root`."
      properties:
        markdown: { type: string, maxLength: 20000 }
        url: { type: string, nullable: true, description: "Link da publicação original (blog)." }
        outlet: { type: string, nullable: true, description: "Veículo/blog original." }
        sources:
          type: array
          maxItems: 10
          items: { type: object, properties: { title: { type: string }, url: { type: string, nullable: true } } }
        root: { $ref: '#/components/schemas/MindMapNode' }

    MindMapNode:
      type: object
      description: Nó de mapa mental (até 120 nós e 5 níveis abaixo do tema central).
      properties:
        id: { type: string }
        label: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 280 }
        children: { type: array, items: { $ref: '#/components/schemas/MindMapNode' } }

    BlogPostInput:
      type: object
      description: Campos editáveis de um post de blog (`kind = noticia`).
      properties:
        title: { type: string, maxLength: 140 }
        description: { type: string, maxLength: 400, description: "Linha fina — obrigatória." }
        text: { type: string, maxLength: 20000, description: "Corpo em Markdown, mínimo 40 caracteres." }
        categoryId: { type: string, description: "Categoria inexistente vira `outros`." }
        tags: { type: array, maxItems: 8, items: { type: string } }
        lang: { type: string, enum: [pt-BR, en] }
        url: { type: string, description: "http(s) da publicação original." }
        outlet: { type: string, description: "Veículo; se vazio, deriva do domínio de `url`." }
        sources:
          type: array
          maxItems: 10
          items: { type: object, properties: { title: { type: string }, url: { type: string } } }

    McpConnection:
      type: object
      description: Conexão de uma IA externa. O token nunca volta depois da criação (só `tokenHint`).
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string, maxLength: 40, example: Claude Desktop }
        tokenHint: { type: string, description: "Últimos 4 caracteres do token." }
        client: { type: string, nullable: true, description: "`clientInfo.name` informado no `initialize`." }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        demo: { type: boolean, description: "Conexão criada pela simulação (`POST /mcp/simulate`)." }

    McpActivity:
      type: object
      description: Registro de cada chamada de ferramenta MCP (últimos 500).
      properties:
        id: { type: string }
        userId: { type: string }
        connectionId: { type: string }
        client: { type: string, nullable: true }
        tool: { type: string }
        write: { type: boolean }
        ok: { type: boolean }
        targetType: { type: string, nullable: true, enum: [deck, material, null] }
        targetId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        error: { type: string }
        at: { type: string, format: date-time }
        seenAt: { type: string, format: date-time }

    McpRequest:
      type: object
      description: >
        Solicitação vinda de uma IA (deck ou material) aguardando ou já decidida pelo aluno —
        `requestView()` em `backend/src/routes/mcp.js`.
      properties:
        id: { type: string, description: "ID da atividade MCP que originou a solicitação." }
        at: { type: string, format: date-time }
        source: { type: string, description: "Nome da conexão MCP." }
        status: { type: string, enum: [pendente, aprovado, recusado] }
        decidedAt: { type: string, format: date-time, nullable: true }
        kind: { type: string, enum: [flashcards, resumo, mapa, noticia] }
        target:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            description: { type: string, description: "Só materiais." }
            categoryName: { type: string }
            scheduled: { type: boolean, description: "Só flashcards." }
            status: { type: string, description: "Status de publicação (só materiais)." }
            audience: { type: string, enum: [comunidade, seguidores], description: "Só materiais." }
            deleted: { type: boolean }
        cards:
          type: array
          description: Só flashcards.
          items: { type: object, properties: { front: { type: string }, back: { type: string } } }
        body: { $ref: '#/components/schemas/MaterialBody' }

    JsonRpcResponse:
      type: object
      description: Resposta JSON-RPC 2.0 — traz `result` ou `error`.
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: { type: string, nullable: true, description: "Ecoa o `id` da requisição (string ou número)." }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          properties:
            code: { type: integer, description: "-32600 requisição inválida · -32601 método não suportado · -32602 ferramenta desconhecida · -32001 token inválido/conta desativada · -32000 método HTTP não permitido." }
            message: { type: string }
            data: { type: object, additionalProperties: true }

paths:
  # ---------------------------------------------------------------- Sistema
  /health:
    get:
      tags: [Sistema]
      summary: Health check
      security: []
      responses:
        "200":
          description: API no ar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  seededAt: { type: string, format: date-time }
                  profile: { type: string }

  # ------------------------------------------------------------ Autenticação
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Login do aluno (e-mail ou atalho de demonstração)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [email, google, microsoft], default: email }
                email: { type: string }
                password: { type: string }
                device: { type: string }
      responses:
        "200":
          description: Sessão criada. Qualquer credencial preenchida funciona no protótipo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  sessionId: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        "422": { $ref: '#/components/responses/Validation' }

  /auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastro (telefone e data de nascimento obrigatórios)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, birthDate, student]
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string, description: "10 a 11 dígitos com DDD." }
                birthDate: { type: string, format: date }
                student: { type: boolean }
                origin: { type: string, nullable: true }
                captchaToken: { type: string, nullable: true }
      responses:
        "201":
          description: Conta criada; próximo passo é confirmar e-mail/telefone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
                  age: { type: integer, nullable: true }
                  requiresGuardianConsent: { type: boolean }
                  nextStep: { type: string, example: confirm }
        "422": { $ref: '#/components/responses/Validation' }
        "429":
          description: "Mais de 5 contas pelo mesmo IP em 24 h sem `captchaToken`."
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/confirm:
    post:
      tags: [Autenticação]
      summary: "Confirma e-mail ou telefone (código fixo no protótipo: 123456)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [channel, code]
              properties:
                channel: { type: string, enum: [email, phone] }
                code: { type: string }
      responses:
        "200":
          description: Canal confirmado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: object, properties: { email: { type: boolean }, phone: { type: boolean } } }
                  user: { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/Validation' }

  /auth/resend:
    post:
      tags: [Autenticação]
      summary: Reenvia o código de confirmação
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { channel: { type: string, enum: [email, phone] } } }
      responses:
        "200": { description: Reenviado (sempre no mock)., content: { application/json: { schema: { type: object, properties: { sent: { type: boolean }, channel: { type: string } } } } } }

  /auth/age-verification:
    post:
      tags: [Autenticação]
      summary: Verificação de idade por terceiro homologado
      description: >
        Menores de 16 anos exigem dados do responsável (`guardian.name`) antes de aprovar.
        Retenção: apenas resultado, método, data, hash e verificador — documento é apagado em 24 h.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string }
                guardian: { type: object, properties: { name: { type: string }, email: { type: string }, phone: { type: string } } }
      responses:
        "200":
          description: "Aprovado, ou `aguardando_responsavel` se faltar o responsável."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [aprovado, aguardando_responsavel] }
                  ageVerification: { type: object, additionalProperties: true }
                  isMinor: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }

  /auth/onboarding:
    post:
      tags: [Autenticação]
      summary: Onboarding — contexto, matérias, tempo disponível e meta sugerida
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context: { type: string }
                subjects: { type: array, items: { type: string } }
                minutesPerDay: { type: integer, default: 10 }
                objective: { type: object, properties: { name: { type: string }, date: { type: string, format: date } } }
      responses:
        "200":
          description: Meta diária calculada e objetivo opcional criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { type: integer }
                  objective: { $ref: '#/components/schemas/Objective' }
                  planOfDay: { type: object, properties: { minutes: { type: integer }, cards: { type: integer } } }

  /auth/password/recover:
    post:
      tags: [Autenticação]
      summary: Recuperação de senha por e-mail
      security: []
      requestBody:
        content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } }
      responses:
        "200": { description: "Sempre responde `sent: true` (não revela se a conta existe)." }
        "422": { $ref: '#/components/responses/Validation' }

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão atual
      responses:
        "200": { description: OK }

  # ----------------------------------------------------------------- Perfil
  /me:
    get:
      tags: [Perfil]
      summary: Dados da própria conta
      description: "Credita +1 Neurônio de acesso diário (uma vez por dia, se verificado e não desativado)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  dailyCredit: { $ref: '#/components/schemas/LedgerEntry' }
                  notifications: { type: object, additionalProperties: true }
                  consents: { type: object, additionalProperties: true }
                  subscription: { type: object, additionalProperties: true }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /me/settings:
    patch:
      tags: [Perfil]
      summary: Atualiza nome, idioma, fuso, meta diária, intensidade de notificação e acessibilidade
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                locale: { type: string }
                timezone: { type: string }
                intensity: { type: string, enum: [leve, padrao, intenso], description: "Contas de menor ficam travadas em leve." }
                reminderTime: { type: string, example: "20:00" }
                push: { type: boolean }
                dailyGoal: { type: integer, minimum: 5, maximum: 200 }
                fatigueDetection: { type: boolean }
                accessibility: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
        "403": { description: "`intensity_locked` para contas de menor.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/sessions:
    get:
      tags: [Perfil]
      summary: Lista dispositivos conectados
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
                  policy: { type: object, properties: { expiresAfterDays: { type: integer }, sliding: { type: boolean } } }
    delete:
      tags: [Perfil]
      summary: Encerra todas as sessões, exceto a atual
      responses: { "200": { description: OK } }

  /me/sessions/{id}:
    delete:
      tags: [Perfil]
      summary: Encerra uma sessão específica
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "409": { description: "Não é possível encerrar a sessão atual por aqui." }

  /me/password:
    post:
      tags: [Perfil]
      summary: Troca de senha (encerra as outras sessões)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [current, next], properties: { current: { type: string }, next: { type: string, minLength: 8 } } }
      responses:
        "200": { description: OK }
        "422": { $ref: '#/components/responses/Validation' }

  /me/consents:
    get:
      tags: [Perfil]
      summary: Consentimentos (escola, WhatsApp por categoria)
      responses: { "200": { description: OK } }
    patch:
      tags: [Perfil]
      summary: Atualiza consentimentos
      description: "Menores sem liberação do responsável recebem `guardian_required` (403) em vez de aplicar."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schoolShare: { type: boolean }
                whatsapp: { type: object, additionalProperties: { type: boolean } }
      responses:
        "200": { description: OK }
        "403": { description: guardian_required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/guardian-requests:
    get:
      tags: [Perfil]
      summary: Lista solicitações pendentes ao responsável (só para menores)
      responses: { "200": { description: OK } }
    post:
      tags: [Perfil]
      summary: Cria uma solicitação de liberação ao responsável
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [community, publicLink, externalMembers, schoolShare, whatsappInfo] }
                detail: { type: string }
      responses:
        "201": { description: Criada }
        "422": { $ref: '#/components/responses/Validation' }

  # ----------------------------------------------------------------- Estudo
  /study/today:
    get:
      tags: [Estudo]
      summary: Sessão de estudo do dia (fila de cards, plano, streak, sugestão da Nôa)
      description: >
        Só decks no agendamento (`scheduled !== false`) entram na fila. `scheduledDecks` lista esses
        decks com progresso e próxima revisão; `unscheduledCount` conta os que estão fora.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudySession' } } } }

  /reviews:
    post:
      tags: [Estudo]
      summary: Envia um lote de revisões (aceita fila offline, dedup por clientId)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviews:
                  type: array
                  items:
                    type: object
                    required: [clientId, cardId, rating]
                    properties:
                      clientId: { type: string, description: "ID gerado no cliente; garante idempotência." }
                      cardId: { type: string }
                      rating: { type: string, enum: [again, hard, good, easy] }
                      reviewedAt: { type: string, format: date-time }
                      durationMs: { type: integer }
                      offline: { type: boolean }
      responses:
        "200":
          description: >
            Revisões aceitas atualizam o agendador FSRS de cada card e a streak (mínimo 20 h
            entre "dias"). Revisões com desvio de horário implausível (> 24 h) entram em
            `flagged` e na fila antifraude.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: array, items: { type: string } }
                  duplicates: { type: array, items: { type: string } }
                  flagged: { type: array, items: { type: string } }
                  doneToday: { type: integer }
                  goal: { type: integer }
                  goalHitToday: { type: boolean }
                  streak: { type: integer }
                  rewards: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
                  balance: { type: integer }

  /study/complete:
    post:
      tags: [Estudo]
      summary: Fecha a sessão do dia e resume o resultado
      responses: { "200": { description: OK } }

  /study/skip:
    post:
      tags: [Estudo]
      summary: '"Hoje não" — reagenda o dia (até 3 vezes por semana)'
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudySession' } } } }
        "409": { description: reschedule_limit }

  /study/undo-skip:
    post:
      tags: [Estudo]
      summary: Desfaz o "Hoje não" do dia
      responses: { "200": { description: OK } }

  /study/pause:
    post:
      tags: [Estudo]
      summary: Pausa a meta por N dias (1 a 30)
      requestBody:
        content: { application/json: { schema: { type: object, required: [days], properties: { days: { type: integer, minimum: 1, maximum: 30 } } } } }
      responses:
        "200": { description: OK }
        "422": { $ref: '#/components/responses/Validation' }

  /study/resume:
    post:
      tags: [Estudo]
      summary: Retoma após pausa — reduz o plano à metade se a pausa foi ≥ 3 dias
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: '#/components/schemas/StudySession' }
                  summary: { type: object, nullable: true, additionalProperties: true }

  /study/goal:
    patch:
      tags: [Estudo]
      summary: Ajusta a meta diária de cards (5 a 200)
      requestBody:
        content: { application/json: { schema: { type: object, required: [goal], properties: { goal: { type: integer, minimum: 5, maximum: 200 } } } } }
      responses: { "200": { description: OK } }

  /study/plan:
    patch:
      tags: [Estudo]
      summary: Reordena decks do dia ou ajusta quantidade por deck
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: array, items: { type: string } }
                adjustments: { type: object, additionalProperties: { type: integer } }
                reset: { type: boolean }
      responses: { "200": { description: OK } }

  /study/fatigue:
    post:
      tags: [Estudo]
      summary: Liga/desliga detecção de cansaço ou mantém a carga do dia
      requestBody:
        content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, keepLoad: { type: boolean } } } } }
      responses: { "200": { description: OK } }

  /study/history:
    get:
      tags: [Estudo]
      summary: Histórico de decks estudados (próprios e da comunidade) e criados
      responses: { "200": { description: OK } }

  /study/mistakes:
    get:
      tags: [Estudo]
      summary: '"Onde você mais erra" — até 8 cards com mais lapsos, com sugestão de reforço da Nôa'
      responses: { "200": { description: OK } }

  /objectives:
    get:
      tags: [Estudo]
      summary: Lista objetivos (provas, concursos)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { objectives: { type: array, items: { $ref: '#/components/schemas/Objective' } } } } } } }
    post:
      tags: [Estudo]
      summary: Cria um objetivo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, date]
              properties: { name: { type: string }, date: { type: string, format: date }, subjects: { type: array, items: { type: string } } }
      responses:
        "201": { description: Criado }
        "422": { $ref: '#/components/responses/Validation' }

  /objectives/{id}:
    patch:
      tags: [Estudo]
      summary: Edita nome, data, matérias ou prioridade do objetivo
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Estudo]
      summary: Remove um objetivo
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /objectives/{id}/outcome:
    post:
      tags: [Estudo]
      summary: Registra o resultado do objetivo (paga +5 Neurônios uma vez)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [outcome], properties: { outcome: { type: string, enum: [aprovado, reprovado, aguardando, nao_fiz] } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  # ------------------------------------------------------------------ Decks
  /decks:
    get:
      tags: [Decks]
      summary: Meus decks, favoritos, pastas e limites do plano
      responses: { "200": { description: OK } }
    post:
      tags: [Decks]
      summary: Cria um deck vazio
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string }, categoryId: { type: string }, tags: { type: array, items: { type: string } }, difficulty: { type: string }, folderId: { type: string, nullable: true } }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { type: object, properties: { deck: { $ref: '#/components/schemas/Deck' } } } } } }
        "422": { $ref: '#/components/responses/Validation' }

  /decks/{id}:
    get:
      tags: [Decks]
      summary: Detalhe do deck, cards e menu de ações disponíveis
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Decks]
      summary: Atualiza flags (difícil/foco/complementar/fixado/agendado), nome, categoria, tags ou pasta
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                difficult: { type: boolean }
                focus: { type: boolean }
                complementary: { type: boolean }
                pinned: { type: boolean }
                scheduled: { type: boolean, description: "false tira o deck da sessão do dia sem excluí-lo; true devolve ao agendamento." }
                name: { type: string }
                categoryId: { type: string }
                tags: { type: array, items: { type: string } }
                difficulty: { type: string, enum: [facil, medio, dificil] }
                folderId: { type: string, nullable: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { deck: { $ref: '#/components/schemas/Deck' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "`pin_limit` — limite de decks fixados do plano atingido." }
    delete:
      tags: [Decks]
      summary: Exclui o deck (soft delete)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /decks/{id}/cards:
    post:
      tags: [Decks]
      summary: Adiciona um card manualmente (até 2.000 por deck)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [front, back]
              properties: { front: { type: string }, back: { type: string }, type: { type: string }, media: { type: object, nullable: true } }
      responses:
        "201": { description: Criado }
        "409": { description: deck_limit }
        "422": { $ref: '#/components/responses/Validation' }

  /decks/{id}/cards/{cardId}:
    patch:
      tags: [Decks]
      summary: Edita frente/verso do card
      parameters: [{ $ref: '#/components/parameters/deckId' }, { $ref: '#/components/parameters/cardId' }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Decks]
      summary: Remove o card (soft delete)
      parameters: [{ $ref: '#/components/parameters/deckId' }, { $ref: '#/components/parameters/cardId' }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /decks/{id}/publish:
    post:
      tags: [Decks]
      summary: Submete o deck para publicação na comunidade
      description: >
        Exige e-mail/telefone confirmados, liberação do responsável se menor (`guardian_required`),
        e aceite da política de conteúdo na primeira vez (`policy_acceptance_required`, HTTP 428).
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { acceptPolicy: { type: boolean } } } } }
      responses:
        "201": { description: Enviado para triagem, content: { application/json: { schema: { type: object, properties: { publication: { $ref: '#/components/schemas/Publication' } } } } } }
        "403": { description: "guardian_required ou verification_required ou account_deactivated" }
        "422": { description: empty_deck }
        "428": { description: policy_acceptance_required }

  /publications/{id}/appeal:
    post:
      tags: [Decks]
      summary: Contesta uma publicação rejeitada (janela de 30 dias, revisor diferente do original)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { type: object, properties: { appeal: { $ref: '#/components/schemas/Appeal' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "not_rejected · appeal_window_closed · appeal_exists" }

  /decks/{id}/export:
    post:
      tags: [Decks]
      summary: Exporta o deck (PDF é entregue como texto no protótipo)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { format: { type: string, enum: [pdf, txt] } } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { fileName: { type: string }, format: { type: string }, url: { type: string, description: "data: URL com o conteúdo." } }

  /folders:
    post:
      tags: [Decks]
      summary: Cria uma pasta (até 3 níveis de profundidade)
      requestBody:
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, parentId: { type: string, nullable: true } } } } }
      responses:
        "201": { description: Criada, content: { application/json: { schema: { type: object, properties: { folder: { $ref: '#/components/schemas/Folder' } } } } } }
        "409": { description: folder_depth }

  /folders/{id}:
    patch:
      tags: [Decks]
      summary: Renomeia a pasta
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /folders/{id}/members:
    post:
      tags: [Decks]
      summary: Adiciona um membro externo à pasta (até 50; exige liberação do responsável se menor)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [contact], properties: { name: { type: string }, contact: { type: string } } } } }
      responses:
        "201": { description: OK }
        "403": { description: guardian_required }
        "409": { description: members_limit }

  /folders/{id}/members/{memberId}:
    delete:
      tags: [Decks]
      summary: Remove um membro da pasta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- Geração
  /generation/quota:
    get:
      tags: [Geração]
      summary: Cota diária de gerações, orçamento de tokens e limite de páginas
      responses: { "200": { description: OK } }

  /generation/jobs:
    get:
      tags: [Geração]
      summary: Lista jobs de geração do usuário
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: '#/components/schemas/GenerationJob' } } } } } } } }
    post:
      tags: [Geração]
      summary: Cria um job de geração a partir de documento, foto, texto colado ou Anki
      description: >
        Aceita `Idempotency-Key` no header (repetir devolve o mesmo job). Bloqueia texto com
        indício de dado pessoal de terceiro (CPF/RG/senha). Acima do orçamento de leitura
        (200.000 tokens ≈ 750 páginas), o job para em `acima_do_orcamento` e espera
        `POST /generation/jobs/{id}/scope`.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [camera, file, text, anki, empty] }
                documentName: { type: string }
                sizeTokens: { type: integer }
                text: { type: string }
      responses:
        "201": { description: "Job criado (ou devolvido, se idempotente)", content: { application/json: { schema: { type: object, properties: { job: { $ref: '#/components/schemas/GenerationJob' } } } } } }
        "422": { description: "validation · content_filtered" }
        "429": { description: daily_limit }

  /generation/jobs/{id}:
    get:
      tags: [Geração]
      summary: Consulta o status do job (para polling do cliente)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { job: { $ref: '#/components/schemas/GenerationJob' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /generation/jobs/{id}/scope:
    post:
      tags: [Geração]
      summary: Escolhe páginas ou divide em várias gerações quando acima do orçamento
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { pages: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }, split: { type: boolean } } } } }
      responses:
        "200": { description: OK }
        "409": { description: invalid_state }
        "422": { $ref: '#/components/responses/Validation' }

  /generation/jobs/{id}/retry:
    post:
      tags: [Geração]
      summary: Tenta novamente um job que falhou (consome cota de novo)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "409": { description: invalid_state }
        "429": { description: daily_limit }

  /generation/jobs/{id}/cancel:
    post:
      tags: [Geração]
      summary: Cancela o job (devolve a cota do dia)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /generation/jobs/{id}/approve:
    post:
      tags: [Geração]
      summary: Aprova o resultado da geração e cria o deck definitivo
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                cards: { type: array, items: { type: object, additionalProperties: true } }
                keepOriginal: { type: boolean, description: "Mantém o documento original após os 30 dias padrão." }
      responses:
        "201": { description: Deck criado, content: { application/json: { schema: { type: object, properties: { deckId: { type: string }, deck: { $ref: '#/components/schemas/Deck' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: invalid_state }

  # -------------------------------------------------------------- Comunidade
  /community/feed:
    get:
      tags: [Comunidade]
      summary: Feed — destaques, seguidos, ranking da semana, criador do mês e recomendações da Nôa
      description: >
        `recommendations` cruza categoria/tags dos decks próprios do aluno com decks da comunidade
        (motivo em `becauseDeck`). Além dos decks, o feed traz os materiais publicados visíveis ao
        aluno (resumos, mapas mentais e posts de blog; os com `audience: seguidores` só para quem
        segue o autor): `latest` (linha do tempo mista, 8 itens), `trending` (6 por engajamento),
        `materials` (agrupados por `kind`), `counts` (por tipo + `mine`) e `sources` (contagem por
        IA de origem). `following` passa a incluir materiais dos autores seguidos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  highlights: { type: array, items: { $ref: '#/components/schemas/CommunityDeck' } }
                  following: { type: array, items: { type: object, additionalProperties: true }, description: "Decks e materiais de autores seguidos." }
                  rankingWeek: { type: array, items: { type: object, additionalProperties: true } }
                  creatorOfMonth: { type: object, nullable: true, additionalProperties: true }
                  recommendations: { type: array, items: { $ref: '#/components/schemas/CommunityDeck' } }
                  latest: { type: array, items: { type: object, additionalProperties: true }, description: "Decks (`kind: flashcards`) e materiais, mais recentes primeiro." }
                  trending: { type: array, items: { type: object, additionalProperties: true } }
                  materials:
                    type: object
                    properties:
                      resumo: { type: array, items: { $ref: '#/components/schemas/Material' } }
                      mapa: { type: array, items: { $ref: '#/components/schemas/Material' } }
                      noticia: { type: array, items: { $ref: '#/components/schemas/Material' } }
                  counts:
                    type: object
                    properties:
                      flashcards: { type: integer }
                      resumo: { type: integer }
                      mapa: { type: integer }
                      noticia: { type: integer }
                      mine: { type: integer }
                  sources: { type: array, items: { type: object, properties: { client: { type: string }, count: { type: integer } } } }
                  categories: { type: array, items: { type: object, additionalProperties: true } }
                  materializedAt: { type: string, format: date-time }
                  rules: { type: object, additionalProperties: true }

  /community/search:
    get:
      tags: [Comunidade]
      summary: Busca de decks e materiais públicos
      description: >
        `results` mistura decks (`kind: flashcards`) e materiais (`resumo`, `mapa`, `noticia`);
        filtre com `kind`. `difficulty` só se aplica a decks; em materiais, `sort=rating` usa
        favoritos em vez de votos.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [flashcards, resumo, mapa, noticia] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: string, enum: [facil, medio, dificil] } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, recent, rating] } }
        - { name: approved, in: query, schema: { type: string, enum: ["1"] }, description: "Filtra por criadores com selo." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true }, description: "CommunityDeck ou Material, conforme `kind`." }
                  total: { type: integer }
                  q: { type: string }
                  filters:
                    type: object
                    properties:
                      categories: { type: array, items: { type: object, additionalProperties: true } }
                      kinds: { type: array, items: { type: string } }
                      difficulties: { type: array, items: { type: string } }
                      sorts: { type: array, items: { type: string } }

  /community/decks/{id}:
    get:
      tags: [Comunidade]
      summary: Detalhe do deck público, cards, tradução e versões
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /community/decks/{id}/favorite:
    post:
      tags: [Comunidade]
      summary: Alterna favorito (com janela de desfazer de 3 s no cliente)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses: { "200": { description: OK } }

  /community/decks/{id}/clone:
    post:
      tags: [Comunidade]
      summary: Clona o deck para "Meus decks" (paga 5 Neurônios de bônus ao autor)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses: { "201": { description: OK } }

  /community/decks/{id}/vote:
    post:
      tags: [Comunidade]
      summary: Vota no deck (exige ≥ 30% dos cards ou 20 cards respondidos)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses:
        "200": { description: OK }
        "403": { description: vote_not_allowed }

  /community/decks/{id}/react:
    post:
      tags: [Comunidade]
      summary: "Reage com um emoji fixo (👏🔥🧠💡❤️😂)"
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [emoji], properties: { emoji: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "422": { $ref: '#/components/responses/Validation' }

  /community/decks/{id}/share:
    post:
      tags: [Comunidade]
      summary: Gera link público de compartilhamento (exige liberação do responsável se menor)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses:
        "200": { description: OK }
        "403": { description: guardian_required }

  /community/decks/{id}/report:
    post:
      tags: [Comunidade]
      summary: Denuncia o deck
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string }, detail: { type: string } } } } } }
      responses:
        "201": { description: Registrada, content: { application/json: { schema: { type: object, properties: { report: { $ref: '#/components/schemas/Report' } } } } } }
        "422": { $ref: '#/components/responses/Validation' }

  /community/decks/{id}/translate:
    post:
      tags: [Comunidade]
      summary: Traduz os cards do deck (cache por conteúdo+idioma; original nunca muda)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses: { "200": { description: OK } }

  /community/decks/{id}/comments:
    get:
      tags: [Comunidade]
      summary: Lista comentários (com respostas aninhadas)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { threads: { type: array, items: { $ref: '#/components/schemas/Comment' } } } } } } } }
    post:
      tags: [Comunidade]
      summary: Comenta ou responde (exige verificação e liberação do responsável se menor)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, parentId: { type: string, nullable: true } } } } } }
      responses:
        "201": { description: Criado }
        "403": { description: "verification_required · guardian_required" }
        "422": { $ref: '#/components/responses/Validation' }

  /community/comments/{id}/report:
    post:
      tags: [Comunidade]
      summary: Denuncia um comentário (vai para análise automática)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: OK } }

  /community/authors/{id}:
    get:
      tags: [Comunidade]
      summary: Perfil público de um criador e seus decks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /community/authors/{id}/follow:
    post:
      tags: [Comunidade]
      summary: Segue/deixa de seguir o criador (exige liberação do responsável se menor)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "403": { description: guardian_required }
        "404": { $ref: '#/components/responses/NotFound' }

  /community/rankings:
    get:
      tags: [Comunidade]
      summary: Ranking semanal e criador do mês
      responses: { "200": { description: OK } }

  /community/decks/{id}/study-start:
    post:
      tags: [Comunidade]
      summary: Inicia estudo de um deck da comunidade sem clonar (progresso registrado por resposta)
      parameters: [{ $ref: '#/components/parameters/deckId' }]
      responses: { "200": { description: OK } }

  # --------------------------------------------------------------- Conteúdos
  /community/materials/{id}:
    get:
      tags: [Conteúdos]
      summary: Detalhe de um resumo, mapa mental ou post de blog (com corpo completo)
      description: >
        Visível se publicado para a comunidade, publicado para seguidores e o aluno segue o autor,
        ou se é do próprio aluno. Conta +1 visualização quando aprovado e de outro autor.
        `moderation` só vem para o dono com publicação submetida.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  material: { $ref: '#/components/schemas/Material' }
                  reactionsList: { type: array, items: { type: string } }
                  related: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Material' } }
                  moderation:
                    type: object
                    nullable: true
                    properties:
                      status: { type: string, enum: [em_triagem, em_revisao, aprovado, rejeitado] }
                      decision: { type: object, nullable: true, properties: { reasonCategory: { type: string, nullable: true }, excerpt: { type: string, nullable: true } } }
                      slaHours: { type: integer }
                      submittedAt: { type: string, format: date-time }
                  notice: { type: string, nullable: true, description: "Aviso exibido em conteúdo gerado por IA." }
        "404": { $ref: '#/components/responses/NotFound' }

  /community/materials/{id}/favorite:
    post:
      tags: [Conteúdos]
      summary: Alterna favorito do material
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { favorited: { type: boolean }, favorites: { type: integer } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /community/materials/{id}/react:
    post:
      tags: [Conteúdos]
      summary: "Alterna uma reação com emoji fixo (👏🔥🧠💡❤️😂)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [emoji], properties: { emoji: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { reactions: { type: object, additionalProperties: { type: integer } }, mine: { type: array, items: { type: string } } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /community/materials/{id}/report:
    post:
      tags: [Conteúdos]
      summary: Denuncia o material (vai para a fila de moderação)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string }, detail: { type: string } } } } } }
      responses:
        "201": { description: Registrada, content: { application/json: { schema: { type: object, properties: { report: { $ref: '#/components/schemas/Report' }, message: { type: string } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /community/materials/{id}/comments:
    get:
      tags: [Conteúdos]
      summary: Lista comentários do material (com respostas aninhadas)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { threads: { type: array, items: { $ref: '#/components/schemas/Comment' } }, total: { type: integer, description: "Comentários + respostas." } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Conteúdos]
      summary: Comenta ou responde em material publicado (exige verificação e liberação do responsável se menor)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 }, parentId: { type: string, nullable: true } } } } } }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { type: object, properties: { comment: { $ref: '#/components/schemas/Comment' }, notifiedAuthor: { type: boolean } } } } } }
        "403": { description: "verification_required · guardian_required" }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /me/materials:
    get:
      tags: [Conteúdos]
      summary: Meus materiais (exceto os recebidos via MCP ainda pendentes de aprovação)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Material' } }, total: { type: integer } } } } } }
    post:
      tags: [Conteúdos]
      summary: Cria um post de blog (rascunho privado)
      description: >
        No app só se cria `kind: noticia` (post de blog); resumos e mapas mentais chegam pela IA
        conectada via MCP. O post nasce `privado` até `POST /me/materials/{id}/publish`.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BlogPostInput'
                - type: object
                  required: [title, description, text]
                  properties:
                    kind: { type: string, enum: [noticia], default: noticia }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { type: object, properties: { material: { $ref: '#/components/schemas/Material' } } } } } }
        "422": { $ref: '#/components/responses/Validation' }

  /me/materials/{id}:
    patch:
      tags: [Conteúdos]
      summary: Edita um post de blog próprio
      description: >
        Campos omitidos mantêm o valor atual. Editar um post já publicado para a comunidade o
        devolve a `privado` (precisa passar de novo pela moderação).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BlogPostInput' } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { material: { $ref: '#/components/schemas/Material' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "`in_review` — o post está em moderação." }
        "422": { description: "validation — inclui tentar editar resumo ou mapa (só posts de blog são editáveis no app)." }
    delete:
      tags: [Conteúdos]
      summary: Exclui um material próprio (soft delete)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /me/materials/{id}/publish:
    post:
      tags: [Conteúdos]
      summary: Publica o material para a comunidade (via moderação) ou só para seguidores
      description: >
        `audience: comunidade` (padrão) submete à fila de moderação e devolve `publication` e
        `sla`. `audience: seguidores` publica na hora, visível só a quem segue o autor, sem
        moderação. Ambos exigem e-mail/telefone confirmados, liberação do responsável se menor e
        aceite da política de conteúdo na primeira vez (`acceptPolicy`).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                audience: { type: string, enum: [comunidade, seguidores], default: comunidade }
                acceptPolicy: { type: boolean }
      responses:
        "201":
          description: Publicado para seguidores ou enviado para triagem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  material: { $ref: '#/components/schemas/Material' }
                  audience: { type: string, enum: [comunidade, seguidores] }
                  publication: { $ref: '#/components/schemas/Publication' }
                  sla: { type: object, nullable: true, properties: { hours: { type: integer }, dueAt: { type: string, format: date-time } } }
        "403": { description: "guardian_required · verification_required · account_deactivated" }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "already_submitted · already_published" }
        "428": { description: policy_acceptance_required }

  /me/materials/{id}/unpublish:
    post:
      tags: [Conteúdos]
      summary: Despublica o material (volta a privado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { material: { $ref: '#/components/schemas/Material' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: not_published }

  /me/publications:
    get:
      tags: [Conteúdos]
      summary: Minhas publicações — materiais e decks próprios com status de publicação
      description: >
        Lista unificada (mais recente primeiro) de materiais e decks, exceto os recebidos via MCP
        ainda pendentes. Itens de deck vêm resumidos com `kind: flashcards`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Material'
                        - type: object
                          properties:
                            kind: { type: string, enum: [flashcards] }
                            id: { type: string }
                            title: { type: string }
                            categoryId: { type: string }
                            categoryName: { type: string }
                            status: { type: string, enum: [privado, em_triagem, aprovado, rejeitado] }
                            audience: { type: string, enum: [comunidade] }
                            createdAt: { type: string, format: date-time }
                            publishedAt: { type: string, format: date-time, nullable: true }
                            cardCount: { type: integer }
                            communityId: { type: string, nullable: true }
                            stats: { type: object, nullable: true, properties: { studiedWeek: { type: integer }, votes: { type: integer }, favorites: { type: integer } } }

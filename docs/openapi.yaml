                      accuracy: { type: object, nullable: true, description: "Acerto (good/easy) nas últimas 30 revisões.", properties: { pct: { type: integer }, sample: { type: integer } } }
                      goal: { type: object, properties: { done: { type: integer }, goal: { type: integer }, suggested: { type: integer, nullable: true } } }
                      streak: { type: integer }
                  catalog: { type: array, items: { type: object, additionalProperties: true } }
                  catalogVersion: { type: string }
                  budget: { type: object, additionalProperties: true }
                  suggestions: { type: array, items: { $ref: '#/components/schemas/NoaSuggestion' } }
                  decisions: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/NoaDecision' } }
                  mcp: { type: object, properties: { connections: { type: integer, description: "Conexões ativas." }, aiSaved: { type: integer, description: "Conteúdos salvos por IAs." } } }
                  signals: { type: array, items: { type: string } }
                  neverAlone: { type: array, items: { type: string } }

  /noa/suggestions/{id}/respond:
    post:
      tags: [Nôa]
      summary: Aceita ou dispensa uma sugestão da Nôa (até 5 sugestões/dia; 1 ação autônoma/dia)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { accepted: { type: boolean }, feedback: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /noa/decisions/{id}/revert:
    post:
      tags: [Nôa]
      summary: Reverte uma decisão autônoma reversível da Nôa
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: not_reversible }

  # ------------------------------------------------------------------ Público
  /public/decks/{publicId}:
    get:
      tags: [Público]
      summary: Prévia pública de um deck (sem login; estudar exige entrar)
      security: []
      parameters: [{ name: publicId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /public/content-policy:
    get:
      tags: [Público]
      summary: Política de conteúdo pública
      security: []
      responses: { "200": { description: OK } }

  # ------------------------------------------------------------ Painel Parental
  /parental/auth/login:
    post:
      tags: [Painel Parental]
      summary: Login do responsável
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "422": { $ref: '#/components/responses/Validation' }

  /parental/overview:
    get:
      tags: [Painel Parental]
      summary: Visão do responsável — permissões, solicitações, decks e resumo semanal do menor
      responses: { "200": { description: OK } }

  /parental/permissions:
    patch:
      tags: [Painel Parental]
      summary: Altera permissões (comunidade, link público, membros externos, escola, WhatsApp) e janela de notificação
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                community: { type: boolean }
                publicLink: { type: boolean }
                externalMembers: { type: boolean }
                schoolShare: { type: boolean }
                whatsappInfo: { type: boolean }
                notificationWindow: { type: object, properties: { start: { type: string }, end: { type: string } } }
      responses: { "200": { description: OK } }

  /parental/requests/{id}/decide:
    post:
      tags: [Painel Parental]
      summary: Aprova ou nega uma solicitação do aluno
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { approve: { type: boolean } } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Painel B2B
  /b2b/auth/login:
    post:
      tags: [Painel B2B]
      summary: Login institucional via SSO (Google Workspace / Microsoft Entra, simulado)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { provider: { type: string, enum: [google, microsoft] }, role: { type: string, enum: [admin, coordenador, professor, leitura] } } } } } }
      responses: { "200": { description: OK } }

  /b2b/overview:
    get:
      tags: [Painel B2B]
      summary: Turmas, indicadores e convites do tenant (agregados só acima do mínimo de consentimentos)
      responses: { "200": { description: OK } }

  /b2b/classes/{id}:
    get:
      tags: [Painel B2B]
      summary: Detalhe de uma turma
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /b2b/invites:
    post:
      tags: [Painel B2B]
      summary: Convida um aluno para uma turma
      requestBody: { content: { application/json: { schema: { type: object, required: [contact, classId], properties: { contact: { type: string }, classId: { type: string }, method: { type: string } } } } } }
      responses:
        "201": { description: OK }
        "403": { description: forbidden }
        "422": { $ref: '#/components/responses/Validation' }

  /b2b/students/{id}/revoke:
    post:
      tags: [Painel B2B]
      summary: Revoga a projeção de indicadores de um aluno (só admin/coordenador)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "403": { description: forbidden }
        "404": { $ref: '#/components/responses/NotFound' }

  /b2b/export:
    get:
      tags: [Painel B2B]
      summary: Exporta indicadores por turma (CSV; XLSX é entregue como CSV no protótipo)
      parameters: [{ name: format, in: query, schema: { type: string, enum: [csv, xlsx] } }]
      responses: { "200": { description: OK } }

  /b2b/users:
    get:
      tags: [Painel B2B]
      summary: Usuários do tenant (só admin)
      responses:
        "200": { description: OK }
        "403": { description: forbidden }

  # ------------------------------------------------------------- Back-office
  /admin/auth/login:
    post:
      tags: [Back-office]
      summary: "Login por papel (moderador, suporte N1/N2, comercial, financeiro, compliance, engenharia)"
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { role: { type: string } } } } } }
      responses: { "200": { description: OK } }

  /admin/me:
    get:
      tags: [Back-office]
      summary: Conta e papel do operador logado
      responses: { "200": { description: OK } }

  /admin/moderation/queue:
    get:
      tags: [Back-office]
      summary: Fila de moderação de publicações (SLA por plano, ordenada por risco e urgência)
      responses: { "200": { description: OK } }

  /admin/moderation/reports:
    get:
      tags: [Back-office]
      summary: Fila de denúncias (decks, comentários, contato suspeito sinalizado pela Nôa — SLA 4 h)
      responses: { "200": { description: OK } }

  /admin/moderation/appeals:
    get:
      tags: [Back-office]
      summary: Fila de contestações de publicações rejeitadas
      responses: { "200": { description: OK } }

  /admin/moderation/{id}:
    get:
      tags: [Back-office]
      summary: Detalhe de uma publicação em moderação
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /admin/moderation/{id}/assign:
    post:
      tags: [Back-office]
      summary: Assume a revisão de uma publicação
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /admin/moderation/{id}/decide:
    post:
      tags: [Back-office]
      summary: Aprova ou rejeita — rejeição exige motivo categorizado e trecho apontado
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [aprovado, rejeitado] }
                reasonCategory: { type: string, enum: [veracidade, material_protegido, conteudo_improprio, dados_pessoais, duplicidade, incompleto, idioma] }
                excerpt: { type: string }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: already_decided }
        "422": { $ref: '#/components/responses/Validation' }

  /admin/moderation/reports/{id}/resolve:
    post:
      tags: [Back-office]
      summary: Resolve uma denúncia (manter, remover, silenciar ou banir — punição exige motivo)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [manter, remover, silenciar, banir] }, reason: { type: string }, durationDays: { type: integer } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /admin/moderation/appeals/{id}/decide:
    post:
      tags: [Back-office]
      summary: Decide uma contestação (precisa ser um moderador diferente do original)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [aceita, mantida] }, note: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "403": { description: same_reviewer }
        "404": { $ref: '#/components/responses/NotFound' }

  /admin/support/search:
    get:
      tags: [Back-office]
      summary: Busca alunos por nome/e-mail (e-mail mascarado)
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/support/users/{id}/view-as:
    post:
      tags: [Back-office]
      summary: '"Ver como" — leitura mascarada da conta, com finalidade e referência de consentimento obrigatórias (log de acesso)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [purpose, consentReference], properties: { purpose: { type: string }, consentReference: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /admin/support/tickets:
    get:
      tags: [Back-office]
      summary: Todos os chamados (SLA 24 h; suspeita com menor em 4 h)
      responses: { "200": { description: OK } }

  /admin/support/tickets/{id}/reply:
    post:
      tags: [Back-office]
      summary: Responde e opcionalmente fecha um chamado
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, close: { type: boolean } } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /admin/commercial/overview:
    get:
      tags: [Back-office]
      summary: Parceiros, campanhas, alertas comerciais e indicadores de resgate
      responses: { "200": { description: OK } }

  /admin/commercial/partners/{id}/approve-stage:
    post:
      tags: [Back-office]
      summary: Avança o parceiro no funil de aprovação (documentação → aprovação comercial)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /admin/finance/overview:
    get:
      tags: [Back-office]
      summary: Pagamentos, MRR, reembolsos, dunning e política de retenção fiscal
      responses: { "200": { description: OK } }

  /admin/compliance/overview:
    get:
      tags: [Back-office]
      summary: Log de auditoria (com verificação de integridade da cadeia de hash), incidentes, DPO e política
      responses: { "200": { description: OK } }

  /admin/compliance/incidents:
    post:
      tags: [Back-office]
      summary: Abre um incidente de segurança/privacidade (prazos de 72 h para ANPD e titulares)
      requestBody: { content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string }, affectedUserIds: { type: array, items: { type: string } } } } } } }
      responses:
        "201": { description: Criado }
        "422": { $ref: '#/components/responses/Validation' }

  /admin/compliance/incidents/{id}/affected:
    get:
      tags: [Back-office]
      summary: Lista titulares afetados por um incidente
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /admin/compliance/incidents/{id}/notify:
    post:
      tags: [Back-office]
      summary: Marca notificação à ANPD ou aos titulares
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [target], properties: { target: { type: string, enum: [anpd, titulares] } } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/Validation' }

  /admin/engineering/overview:
    get:
      tags: [Back-office]
      summary: Feature flags, custo de IA, qualidade da Nôa, templates de notificação e SLOs
      responses: { "200": { description: OK } }

  /admin/engineering/flags/{key}:
    patch:
      tags: [Back-office]
      summary: Liga/desliga uma feature flag ou aciona o kill switch
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { on: { type: boolean }, kill: { type: boolean } } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- Painel do Parceiro
  /partner/auth/login:
    post:
      tags: [Painel do Parceiro]
      summary: Login do parceiro (CNPJ + senha)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [cnpj, password], properties: { cnpj: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "422": { $ref: '#/components/responses/Validation' }

  /partner/overview:
    get:
      tags: [Painel do Parceiro]
      summary: Campanhas, resgates, conversão (com supressão de células pequenas) e faturamento
      responses: { "200": { description: OK } }

  /partner/campaigns:
    post:
      tags: [Painel do Parceiro]
      summary: Cria uma campanha de cupom
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, costNeurons, stock]
              properties: { title: { type: string }, description: { type: string }, costNeurons: { type: integer, minimum: 1 }, stock: { type: integer, minimum: 1 }, validityDays: { type: integer, default: 30 } }
      responses:
        "201": { description: Criada }
        "422": { $ref: '#/components/responses/Validation' }

  /partner/campaigns/{id}:
    patch:
      tags: [Painel do Parceiro]
      summary: Atualiza estoque ou pausa a campanha
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /partner/redemptions/validate:
    post:
      tags: [Painel do Parceiro]
      summary: Dá baixa em um código de resgate (uma única vez)
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "404": { description: not_found }
        "409": { description: already_used }
        "410": { description: expired }
        "422": { $ref: '#/components/responses/Validation' }

  /partner/contract/accept:
    post:
      tags: [Painel do Parceiro]
      summary: Aceite digital do contrato do parceiro
      responses: { "200": { description: OK } }

  # ------------------------------------------------------------------- Proto
  /_proto/state:
    get:
      tags: [Sistema]
      summary: Estado atual do protótipo (perfil, saldo, cota) — sem autenticação
      security: []
      responses: { "200": { description: OK } }

  /_proto/reset:
    post:
      tags: [Sistema]
      summary: Reseta todo o estado em memória para um perfil semeado
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { profile: { type: string, enum: [adult-free, adult-premium, minor] } } } } } }
      responses: { "200": { description: OK } }

  /_proto/profile:
    post:
      tags: [Sistema]
      summary: Troca o perfil ativo sem resetar o restante do estado
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { type: string } } } } } }
      responses:
        "200": { description: OK }
        "422": { $ref: '#/components/responses/Validation' }

  /_proto/coupon-available:
    post:
      tags: [Sistema]
      summary: Ajusta o saldo para simular "cupom resgatável" ligado/desligado
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { available: { type: boolean } } } } } }
      responses: { "200": { description: OK } }

  /_proto/notification:
    post:
      tags: [Sistema]
      summary: Simula o disparo de uma notificação push/WhatsApp (respeita opt-in, janela de silêncio e deduplicação)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { channel: { type: string, enum: [push, whatsapp] }, force: { type: boolean } } } } } }
      responses: { "200": { description: "`delivered: false` com o motivo, ou `delivered: true` com o conteúdo da notificação." } }

  /mcp/simulate:
    post:
      tags: [MCP]
      summary: Simula uma IA enviando conteúdo via MCP (protótipo)
      description: >
        Usa a primeira conexão ativa do aluno (ou cria uma conexão de demonstração "Claude Desktop")
        e chama `salvar_flashcards` ou `salvar_noticia` com uma amostra semeada, alternando entre
        as amostras a cada chamada. O resultado vira uma solicitação pendente em Recebidos.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { kind: { type: string, enum: [flashcards, noticia], default: flashcards } } } } }
      responses:
        "201":
          description: Enviado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: object, additionalProperties: true, description: "`structuredContent` da ferramenta (id, tipo, titulo, status: pendente, link)." }
                  connection: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  activityId: { type: string }
        "422": { description: simulation_failed }

  /mcp:
    post:
      tags: [MCP]
      summary: Endpoint do servidor MCP (JSON-RPC 2.0 sobre Streamable HTTP, sem SSE)
      description: |
        Autenticado com o **token de conexão MCP** (`Authorization: Bearer mcp_...`), não com o token
        de sessão. Uma mensagem por requisição (lotes → 400). Erros de autenticação e protocolo
        também vêm no formato JSON-RPC.

        Métodos:
        - `initialize` — negocia `protocolVersion` (2025-06-18, 2025-03-26 ou 2024-11-05; padrão a
          mais recente), registra `clientInfo.name` na conexão e devolve `capabilities.tools`,
          `serverInfo` e `instructions`.
        - `ping` — devolve `{}`.
        - `tools/list` — catálogo de ferramentas com `inputSchema` e `annotations`.
        - `tools/call` — `params: { name, arguments }`; devolve `{ content, structuredContent, isError }`.
        - `resources/list` e `prompts/list` — listas vazias.
        - Notificações (sem `id`, ex.: `notifications/initialized`) → **202** sem corpo.
        - Outros métodos → erro `-32601`.

        Ferramentas (`backend/src/lib/mcpTools.js`):
        - Escrita (até 50 por dia; tudo chega como solicitação **pendente** em Recebidos):
          `salvar_flashcards`, `salvar_resumo`, `salvar_mapa_mental`, `salvar_noticia`.
        - Leitura: `buscar_comunidade`, `ler_conteudo`, `meus_conteudos`, `listar_categorias`.

        Erro de entrada de ferramenta não é erro JSON-RPC: volta como `result` com `isError: true`
        e a mensagem em `content[0].text`.
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                id: { type: string, description: "String ou número; ausente em notificações." }
                method: { type: string, enum: [initialize, ping, tools/list, tools/call, resources/list, prompts/list, notifications/initialized] }
                params: { type: object, additionalProperties: true }
            example:
              jsonrpc: "2.0"
              id: 1
              method: tools/call
              params:
                name: salvar_flashcards
                arguments:
                  titulo: Revolução Francesa
                  categoria: vestibular
                  cards: [{ frente: "Ano da Queda da Bastilha?", verso: "1789" }]
      responses:
        "200": { description: Resposta JSON-RPC (`result` ou `error`)., content: { application/json: { schema: { $ref: '#/components/schemas/JsonRpcResponse' } } } }
        "202": { description: Notificação aceita (sem corpo). }
        "400": { description: "Requisição JSON-RPC inválida ou lote (`-32600`).", content: { application/json: { schema: { $ref: '#/components/schemas/JsonRpcResponse' } } } }
        "401": { description: "Token MCP ausente, inválido ou revogado (`-32001`, com `WWW-Authenticate: Bearer realm=\"memora-mcp\"`).", content: { application/json: { schema: { $ref: '#/components/schemas/JsonRpcResponse' } } } }
        "403": { description: "Conta desativada (`-32001`).", content: { application/json: { schema: { $ref: '#/components/schemas/JsonRpcResponse' } } } }
    get:
      tags: [MCP]
      summary: Não suportado — o servidor MCP responde só a POST
      security: []
      responses:
        "405": { description: "`Allow: POST`; erro JSON-RPC `-32000`.", content: { application/json: { schema: { $ref: '#/components/schemas/JsonRpcResponse' } } } }
    delete:
      tags: [MCP]
      summary: Não suportado — o servidor MCP responde só a POST
      security: []
      responses:
        "405": { description: "`Allow: POST`; erro JSON-RPC `-32000`.", content: { application/json: { schema: { $ref: '#/components/schemas/JsonRpcResponse' } } } }


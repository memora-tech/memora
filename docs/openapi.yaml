      summary: Aprova uma solicitação recebida via MCP
      description: >
        Deck: entra na biblioteca; `schedule: false` o deixa fora da sessão do dia (padrão: agendado).
        Material: `audience` decide o destino — `comunidade` (padrão, vai para moderação),
        `seguidores` (publica na hora só para seguidores) ou `privado` (fica só com o aluno). Os
        dois primeiros seguem as mesmas pré-condições de `POST /me/materials/{id}/publish`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule: { type: boolean, default: true, description: "Só flashcards." }
                audience: { type: string, enum: [comunidade, seguidores, privado], default: comunidade, description: "Só materiais." }
                acceptPolicy: { type: boolean, description: "Só materiais publicados." }
